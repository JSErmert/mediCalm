<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="mediCalm">
  <!--
    The idle orb, reduced to a tab icon. Colours are the D4-B4 Deep Current orb
    stops from src/styles/tokens.css (--color-orb-center / -mid / -edge) on the
    deep-water ground (--color-bg-base), so the tab reads as the same object the
    app opens with. Kept as a single sphere: the ping rings do not survive at
    16px and would only muddy the silhouette.
  -->
  <rect width="64" height="64" rx="14" fill="#020a10" />
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dff6f8" />
      <stop offset="6%" stop-color="#b8e8ed" />
      <stop offset="30%" stop-color="#2196a8" />
      <stop offset="62%" stop-color="#155e6e" />
      <stop offset="100%" stop-color="#0d3d4a" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a8a8a" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#1a8a8a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="26" fill="url(#glow)" />
  <circle cx="32" cy="32" r="16" fill="url(#orb)" />
</svg>
